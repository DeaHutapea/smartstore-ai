[project]
name = "smartstore-ai-cheapest-price"
version = "0.1.0"
description = "SmartStore AI - Sistem Pencarian Harga Termurah E-Commerce — Proyek Akhir 10S3001 Kecerdasan Buatan"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=6.21.4",
    "sentence-transformers>=6.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
