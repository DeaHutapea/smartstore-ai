[project]
name = "smartstore-ai-cheapest-price"
version = "0.1.0"
description = "SmartStore AI - Sistem Pencarian Harga Termurah E-Commerce — Proyek Akhir 10S3001 Kecerdasan Buatan"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.0.0",
    "sentence-transformers>=3.0.0",
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "pypdfium2>=4.30.0"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
